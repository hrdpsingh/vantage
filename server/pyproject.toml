[project]
name = "server"
version = "0.1.0"
description = "A repository analytics tool powered by the GitHub API."
readme = "README.md"
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.141.1",
    "requests>=2.34.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
